name: 每日更新世界杯数据

on:
  schedule:
    # UTC 时间每天 02:00 跑一次 = 北京时间上午10点
    # openfootball 通常在比赛日结束后更新，可根据需要调整或增加多个时间点
    - cron: "0 2 * * *"
  workflow_dispatch: {}  # 允许在GitHub网页上手动点按钮触发，方便测试

permissions:
  contents: write  # 需要写权限才能 commit 回仓库

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取并生成 team_form.json
        run: python3 scripts/fetch_and_build.py

      - name: 检查是否有变化
        id: check_changes
        run: |
          if git diff --quiet data/team_form.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit & push（仅当数据有变化时）
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "wc-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/team_form.json
          git commit -m "chore: 自动更新世界杯赛果数据 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
